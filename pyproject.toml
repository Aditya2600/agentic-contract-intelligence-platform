[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "doctask"
version = "0.1.0"
description = "Agentic vendor obligations register starter"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "langgraph>=1.1",
  "langgraph-checkpoint-postgres>=3.0",
  "psycopg[binary,pool]>=3.2",
  "mcp>=1.0",
  "python-multipart>=0.0.9",
  "pymupdf>=1.24",
  "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
  "ruff>=0.6",
  "mypy>=1.11",
]

[tool.hatch.build.targets.wheel]
packages = ["src/doctask"]

[tool.pytest.ini_options]
# "src" so `import doctask` works from a source checkout; "." so the few tests that
# share a fixture corpus can `from tests.robustness_corpus import ...`. Without the
# second entry a clean clone needs `PYTHONPATH=. pytest`, and plain `pytest` -- which is
# what the README tells a reviewer to run -- fails at collection.
pythonpath = ["src", "."]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
